      type: object
      additionalProperties: true
      properties: {}
    AccountancyInvolvedUserRoles:
      type: object
      additionalProperties: true
      properties: {}
    AccountancyInvolvedUsers:
      type: object
      additionalProperties: true
      properties: {}
    AccountancySolutionLinks:
      type: object
      additionalProperties: true
      properties: {}
    AccountancyTaskTypes:
      type: object
      additionalProperties: true
      properties: {}
