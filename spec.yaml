      operationId: AccountInvolvedAccounts_get
      summary: GET AccountInvolvedAccounts
      description: 'This resource will show all accounts which are involved for a
        specific account and will also show the type of the relation between the accounts.
        This functionality is only available in a practice management company.


        Official docs: https://start.exactonline.nl/docs/HlpRestAPIResourcesDetails.aspx?name=AccountancyAccountInvolvedAccounts

        Scope: Accountancy practicemanagement'
